<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince Daryl R. Nieves - Grid Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Main Section -->
    <main>
        <div class="gallery-container">
            <div class="col-side">
                <div class="box sq" data-title="Mercury"><img src="assets/images/mercury.jpg" alt="Mercury"></div>
                <div class="box sq" data-title="Venus"><img src="assets/images/venus.jpg" alt="Venus"></div>
                <div class="box tall" data-title="Earth"><img src="assets/images/earth.jpg" alt="Earth"></div>
            </div>

            <div class="col-pillar">
                <div class="box full" data-title="Milky Way"><img src="assets/images/milky-way.jpg" alt="Milky Way"></div>
            </div>

            <div class="col-center">
                <div class="box banner" data-title="Solar System"><img src="assets/images/solar-system.jpg" alt="Solar System"></div>

                <div class="center-mid-row">
                    <div class="mid-side-stack">
                        <div class="box sq" data-title="Mars"><img src="assets/images/mars.jpg" alt="Mars"></div>
                        <div class="box sq" data-title="Phobos"><img src="assets/images/phobos.jpg" alt="Phobos"></div>
                    </div>

                    <div class="box fav" data-title="Saturn"><img src="assets/images/saturn.jpg" alt="Saturn"></div>
                    <div class="box fav" data-title="Jupiter"><img src="assets/images/jupiter.jpg" alt="Jupiter"></div>

                    <div class="mid-side-stack">
                        <div class="box sq" data-title="Uranus"><img src="assets/images/uranus.png" alt="Uranus"></div>
                        <div class="box sq" data-title="Neptune"><img src="assets/images/neptune.jpg" alt="Neptune"></div>
                    </div>
                </div>

                <div class="center-split-row">
                    <div class="box half-banner" data-title="Andromeda"><img src="assets/images/andromeda.jpg" alt="Andromeda"></div>
                    <div class="box half-banner" data-title="Orion Nebula"><img src="assets/images/orion-nebula.jpg" alt="Orion Nebula"></div>
                </div>

                <div class="box banner" data-title="Deep Space"><img src="assets/images/deep-space.jpg" alt="Deep Space"></div>
            </div>

            <div class="col-pillar">
                <div class="box full" data-title="Black Hole"><img src="assets/images/black-hole.jpg" alt="Black Hole"></div>
            </div>

            <div class="col-side">
                <div class="box tall" data-title="Pluto"><img src="assets/images/pluto.jpg" alt="Pluto"></div>
                <div class="box sq" data-title="Europa"><img src="assets/images/europa.webp" alt="Europa"></div>
                <div class="box sq" data-title="Moon"><img src="assets/images/moon.jpg" alt="Moon"></div>
            </div>
        </div>
    </main>
</body>
</html>
